<style>:root{--navy:#1F3A5F;--navy2:#2c5282;--acc:#E07B24;--bg:#f3f5f8;--card:#fff;--line:#dde3ea;--tx:#1d2733;--mut:#6b7785;--ok:#1f8a4c;--warn:#c98a00;--bad:#c0392b;--blue:#2f6fb5;--p8:#d9a300;--p9:#3a3a3a;--p12:#2e8b3e}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}
a{color:var(--blue)}
.hidden{display:none!important}
/* top */
#top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;padding:8px 14px;min-height:52px}
#top .ttl{font-weight:700;line-height:1.15}
#top .ttl small{display:block;font-weight:400;opacity:.75;font-size:11.5px}
#top .sp{flex:1}
#burger{background:none;border:0;color:#fff;font-size:22px;cursor:pointer;padding:2px 6px}
.chip{border-radius:20px;padding:4px 10px;font-size:12px;cursor:pointer;border:1px solid rgba(255,255,255,.35);white-space:nowrap;background:rgba(255,255,255,.1);color:#fff}
.chip.ok{background:#1f8a4c;border-color:#1f8a4c}.chip.wait{background:#c98a00;border-color:#c98a00}.chip.bad{background:#c0392b;border-color:#c0392b}
#userbtn{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* layout */
#wrap{display:flex;min-height:calc(100vh - 52px)}
#nav{width:236px;background:#fff;border-right:1px solid var(--line);padding:8px 0;flex-shrink:0;overflow:auto;position:sticky;top:52px;height:calc(100vh - 52px)}
#nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);padding:10px 16px 4px}
#nav a{display:block;padding:8px 16px;color:var(--tx);text-decoration:none;border-left:3px solid transparent;cursor:pointer}
#nav a:hover{background:#f1f4f8}
#nav a.on{background:#eaf0f7;border-left-color:var(--acc);font-weight:600;color:var(--navy)}
#main{flex:1;min-width:0;padding:16px 18px 60px}
@media(max-width:899px){#nav{position:fixed;left:-260px;top:52px;z-index:40;transition:left .2s;box-shadow:2px 0 12px rgba(0,0,0,.15)}#nav.open{left:0}#main{padding:12px 10px 60px}}
@media(min-width:900px){#burger{display:none}}
h1{font-size:20px;margin:2px 0 12px;color:var(--navy)}
h2{font-size:16px;margin:0 0 10px;color:var(--navy)}
h3{font-size:14px;margin:12px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

}

const objLbl = id => { const o = objGet(id); return o ? o.kode : (id || ''); };
const objLblL = id => { const o = objGet(id); return o ? o.no + ' · ' + o.kode : (id || ''); };
function setTahap(o) { return !o ? [] : o.jenis === 'tb' ? TAHAP.tb : (o.tipe === 'F1' ? TAHAP.f1 : TAHAP.std); }
function setKey(o) { return o.jenis === 'tb' ? 'tb' : (o.tipe === 'F1' ? 'f1' : 'std'); }
function tahapNama(k) { for (const s of Object.values(TAHAP)) for (const x of s) if (x[0] === k) return x[1]; return k; }
const hitung = o => o && o.status === 'AKTIF';
const bobotObj = o => num(o.vol) > 0 ? num(o.vol) : 1;

function progMap(sampai) {
  const m = {};
  const rs = rows('progres').filter(r => !sampai || r.tgl <= sampai)
    .sort((a, b) => a.tgl < b.tgl ? -1 : a.tgl > b.tgl ? 1 : num(a._ubah) - num(b._ubah));
  for (const r of rs) (m[r.obj] || (m[r.obj] = {}))[r.tahap] = Math.max(0, Math.min(100, num(r.pct)));
  return m;
}
function objPct(o, pm) {
  const b = cfg('bobot')[setKey(o)] || {}; const p = pm[o.id] || {};
  let s = 0, w = 0;
  for (const [k] of setTahap(o)) { const bw = num(b[k]); w += bw; s += bw * (p[k] || 0) / 100; }
  return w ? s / w * 100 : 0;
}
function agregat(pm, filter) {
  let s = 0, w = 0; const B = cfg('bobot');
  for (const o of objAll()) { if (!hitung(o) || (filter && !filter(o))) continue; const b = bobotObj(o); w += b; s += b * objPctB(o, pm, B); }
  return w ? s / w : 0;
}
const sCurve = x => x <= 0 ? 0 : x >= 1 ? 1 : 3 * x * x - 2 * x * x * x;
function bobotPaket() {
  const w = {};
  for (const o of objAll()) if (hitung(o)) w[o.paket] = (w[o.paket] || 0) + bobotObj(o);
  return w;
}
function rencanaPct(tgl, paket) {
  const j = cfg('jadwal'), w = bobotPaket();
  let s = 0, tw = 0;
  for (const p of Object.keys(w)) {
    if (paket && p !== paket) continue;
    const jp = j[p]; if (!jp) continue;
    const dur = Math.max(1, diffD(jp[0], jp[1]) + 1);
    const x = (diffD(jp[0], tgl) + 1) / dur;
    s += w[p] * sCurve(x); tw += w[p];
  }
  return tw ? s / tw * 100 : 0;
}
function mpRencana(tgl) { let j = 0; for (const x of cfg('mp').slice().sort((a, b) => a.mulai < b.mulai ? -1 : 1)) if (tgl >= x.mulai) j = num(x.jml); return j; }

let SY = { busy: false, st: 'lokal', err: '', last: 0, timer: null, kirimT: null };
async function api(aksi, data = {}, ms = 90000) {
  const ctl = new AbortController(); const tt = setTimeout(() => ctl.abort(), ms);
  try {
    const r = await fetch(S.cfg.url, { method: 'POST', body: JSON.stringify(Object.assign({ token: S.cfg.token, aksi }, data)), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow', signal: ctl.signal });
    if (r.status === 404) throw new Error('Alamat server tidak ditemukan (404). Periksa URL /exec atau deploy ulang.');
    const txt = await r.text(); let j;
    try { j = JSON.parse(txt); } catch (e) { throw new Error('Balasan server bukan JSON. Pastikan akses Web App "Siapa saja".'); }
    if (!j.ok) throw new Error(j.err || 'Server menolak');
    return j;
  } catch (e) { if (e.name === 'AbortError') throw new Error('Server tidak menjawab (batas waktu).'); throw e; }
  finally { clearTimeout(tt); }
}
const jmlTunggu = () => Object.keys(S.dirty).filter(k => !k.startsWith('hadir|')).length + Object.keys(S.pend).length;
function chip() {
  const c = $('#chip'); if (!c) return;
  const n = jmlTunggu();
  if (!S.cfg.url) { c.className = 'chip'; c.textContent = 'Mode lokal'; return; }
  if (SY.busy) { c.className = 'chip wait'; c.textContent = 'Sinkron…'; return; }

  const on = typeof daftarOnline === 'function' ? daftarOnline().length : 0;
  c.className = 'chip ok'; c.textContent = 'Tersinkron' + (on > 1 ? ' · ' + on + ' online' : '');
}
function jadwalKirim() { chip(); if (!S.cfg.url) return; clearTimeout(SY.kirimT); SY.kirimT = setTimeout(() => sinkron(), 1200); }
async function unggahFoto() {
  for (const key of Object.keys(S.pend)) {
    const p = S.pend[key]; if (!p || !p.data) { delete S.pend[key]; continue; }
    const m = /^data:([^;]+);base64,(.*)$/.exec(p.data); if (!m) { delete S.pend[key]; continue; }
    const j = await api('foto', { nama: p.nama || key + '.jpg', mime: m[1], data: m[2], bulan: (p.tgl || today()).slice(0, 7) }, 120000);
    const r = TB_(p.t)[p.id];
    if (r && r[p.f] === 'pend:' + key) { r[p.f] = 'drive:' + j.id; put(p.t, r, { noAudit: true }); }
    else if (r && String(r[p.f] || '').startsWith('[') && String(r[p.f]).includes('pend:' + key)) { r[p.f] = JSON.stringify(fotoArr(r[p.f]).map(x => x === 'pend:' + key ? 'drive:' + j.id : x)); put(p.t, r, { noAudit: true }); }
    delete S.pend[key]; persist();
  }
}
async function kirim() {
  const keys = Object.keys(S.dirty); if (!keys.length) return;
  for (let i = 0; i < keys.length; i += 250) {
    const part = keys.slice(i, i + 250);
    const baris = part.map(k => { const [t, ...id] = k.split('|'); return { t, r: TB_(t)[id.join('|')] }; }).filter(b => b.r);
    const ub = baris.map(b => b.r._ubah);
    const j = await api('simpan', { baris });
    baris.forEach((b, x) => { const k = b.t + '|' + b.r.id; const cur = TB_(b.t)[b.r.id]; if (cur && cur._ubah === ub[x]) delete S.dirty[k]; });
    if (j.ditolak && j.ditolak.length) S.srv = 0;
    persist();
  }
}
async function tarik() {
  const j = await api('muat', { sejak: S.srv || 0 });
  let ubah = 0;
  for (const [t, rs] of Object.entries(j.data || {})) {
    for (const r of rs) {
      if (!r.id) continue;
      const k = t + '|' + r.id, L = TB_(t)[r.id];
      if (S.dirty[k] && L && num(L._ubah) > num(r._ubah)) continue;
      if (L && num(L._ubah) === num(r._ubah) && L._hapus === r._hapus) { delete S.dirty[k]; continue; }
      TB_(t)[r.id] = r; delete S.dirty[k]; ubah++;
    }
  }
  S.srv = Math.max(0, num(j.waktu) - 120000);
  persist();
  return ubah;
}
async function sinkron(paksa) {
  if (!S.cfg.url || SY.busy) return;
  SY.busy = true; chip();
  try {
    await unggahFoto();
    await kirim();
    const u = await tarik();
    if (semai()) await kirim();
    SY.st = 'ok'; SY.err = ''; SY.last = Date.now();
    if (u || paksa) segarkan();
  } catch (e) { SY.st = 'gagal'; SY.err = e.message || String(e); }
  SY.busy = false; chip();
}

  if (!Object.keys(TB_('users')).length) { USERS_DEF.forEach(r => { TB_('users')[r.id] = Object.assign({ aktif: '1' }, r, { _ubah: 1, _oleh: 'sistem' }); S.dirty['users|' + r.id] = 1; }); ada = true; }

function fotoSrc(v, w = 400) {
  if (!v) return '';
  if (v.startsWith('drive:')) return `https://drive.google.com/thumbnail?id=${v.slice(6)}&sz=w${w}`;
  if (v.startsWith('pend:')) { const p = S.pend[v.slice(5)]; return p ? p.data : ''; }
  if (v.startsWith('data:') || v.startsWith('http')) return v;
  return '';
}
const fotoArr = v => !v ? [] : String(v).trim().startsWith('[') ? jsonArr(v).filter(Boolean) : [String(v)];
function thumbs(v, max = 3) { const L = fotoArr(v); if (!L.length) return ''; return L.slice(0, max).map(x => `<img class="thumb" src="${fotoSrc(x, 120)}" onclick="lihatFoto('${esc(x)}')">`).join(' ') + (L.length > max ? ` <span class="small mut">+${L.length - max}</span>` : ''); }
function lihatFoto(v, ket) { modal('Foto', `<img src="${fotoSrc(v, 1600)}" style="width:100%;border-radius:8px"><p class="small mut">${esc(ket || '')}</p>${v.startsWith('drive:') ? `<a target="_blank" href="https://drive.google.com/file/d/${v.slice(6)}/view">Buka di Google Drive</a>` : '<span class="b warn">Belum terunggah ke server</span>'}`, { wide: true }); }
function kompres(file, max = 1280, q = .8) {
  return new Promise((ok, no) => {
    const fr = new FileReader();
    fr.onload = () => { const im = new Image(); im.onload = () => { let { width: w, height: h } = im; const s = Math.min(1, max / Math.max(w, h)); w = Math.round(w * s); h = Math.round(h * s); const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(im, 0, 0, w, h); ok(c.toDataURL('image/jpeg', q)); }; im.onerror = no; im.src = fr.result; };
    fr.onerror = no; fr.readAsDataURL(file);
  });
}
// Foto langsung diunggah ke Google Drive server bila online; aplikasi hanya menyimpan tautannya.
// Bila sinyal putus, foto dititip sementara di perangkat lalu terkirim otomatis saat sinkron.
async function simpanFotoBaru(file, t, id, f, tgl) {
  const data = await kompres(file);
  const key = uid('F'), nama = (id + '_' + key + '.jpg').replace(/[^\w.-]/g, '_');
  if (S.cfg.url && navigator.onLine !== false) {
    try { const m = /^data:([^;]+);base64,(.*)$/.exec(data); const j = await api('foto', { nama, mime: m[1], data: m[2], bulan: (tgl || today()).slice(0, 7) }, 60000); if (j.id) return 'drive:' + j.id; } catch (e) { }
  }
  S.pend[key] = { data, t, id, f, tgl, nama };
  return 'pend:' + key;
}

async function unggahBerkas(file, folder) {
  if (!S.cfg.url) throw new Error('Unggah dokumen perlu tersambung ke server (Pengaturan → Sambungan server).');
  if (file.size > 15 * 1024 * 1024) throw new Error('Ukuran berkas maksimal 15 MB.');
  const data = await new Promise((ok, no) => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.onerror = no; fr.readAsDataURL(file); });
  const m = /^data:([^;]*);base64,(.*)$/.exec(data);
  const j = await api('foto', { nama: file.name, mime: m[1] || file.type || 'application/octet-stream', data: m[2], bulan: folder }, 180000);
  return 'drive:' + j.id;
}

let _xl;
function muatXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (_xl) return _xl;
  _xl = new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = () => ok(window.XLSX); s.onerror = () => { _xl = null; no(new Error('Pustaka Excel gagal dimuat (perlu internet).')); }; document.head.appendChild(s); });
  return _xl;
}
async function unduhExcel(nama, sheets) {
  try {
    const X = await muatXLSX(); const wb = X.utils.book_new();
    for (const [sn, aoa] of sheets) { const ws = X.utils.aoa_to_sheet(aoa); ws['!cols'] = (aoa[0] || []).map((_, i) => ({ wch: Math.min(45, Math.max(8, ...aoa.slice(0, 200).map(r => String(r[i] ?? '').length + 2))) })); X.utils.book_append_sheet(wb, ws, sn.slice(0, 31)); }
    X.writeFile(wb, nama + '.xlsx');
  } catch (e) {
    const q = r => r.map(v => '"' + String(v ?? '').replace(/"/g, '""') + '"').join(';');
    const csv = sheets.map(([sn, aoa], i) => (sheets.length > 1 ? q([sn]) + '\n' : '') + aoa.map(q).join('\n')).join('\n\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })); a.download = nama + '.csv'; a.click();

}

function cekObj(t) {
  return n => {
    if (rows('titik').concat(rows('tb')).some(r => r.id !== n.id && r.kode.toLowerCase() === n.kode.toLowerCase())) return 'Kode "' + n.kode + '" sudah dipakai';
    if (rows(t).some(r => r.id !== n.id && r.no.toLowerCase() === n.no.toLowerCase())) return 'No. urut "' + n.no + '" sudah dipakai';
    return '';
  };
}
function sebelumObj(t) {
  return (n, baru) => {
    if (baru && !TB_(t)[n.kode] && !TB_(t === 'titik' ? 'tb' : 'titik')[n.kode]) n.id = n.kode;
    if (t === 'titik' && SEED && (n.x === undefined || n.x === '')) {
      const m = /^([A-J])\s*\/\s*(\d{1,2})$/i.exec(n.grid || '');
      if (m && SEED.grid.X[m[2]] !== undefined) { n.x = SEED.grid.X[m[2]]; n.y = SEED.grid.Y[m[1].toUpperCase()]; }
    }
    if (t === 'tb' && num(n.panjang) > 0 && !(num(n.vol) > 0)) { const a = { TB1: .175, TB2: .15, TB4: .08 }[n.tipe]; if (a) n.vol = String(+(num(n.panjang) * a).toFixed(3)); }
    if (baru && !n.urut) n.urut = String(rows(t).length + 1);
  };
}
SK.titik.cek = cekObj('titik'); SK.titik.sebelum = sebelumObj('titik');
SK.tb.cek = cekObj('tb'); SK.tb.sebelum = sebelumObj('tb');

/* ---- format sel ---- */
function selNilai(t, k, r) {
  const f = (SK[t]?.f || []).find(x => x.k === k);
  const v = r[k];
  if (k === '_siap') { const ok = r.tglMpj && r.tglMp && r.tglKie; return ok ? '<span class="b ok">Siap cor</span>' : '<span class="b warn">Belum lengkap</span>'; }
  if (k === '_waste') { const a = num(r.volT), b = num(r.volD); if (!a || !b) return ''; const w = (b - a) / a * 100; return `<span class="b ${w > 5 ? 'bad' : w > 2 ? 'warn' : 'ok'}">${fmtN(w, 1)}%</span>`; }
  if (k === '_badge') return badgeSt(r);
  if (k === '_rek') return r.noRek ? esc((r.bank || '') + ' ' + r.noRek) + (r.atasNama && r.atasNama !== r.nama ? '<div class="small mut">a.n. ' + esc(r.atasNama) + '</div>' : '') : '<span class="b warn">belum ada</span>';
  if (k === 'paket') return bPaket(v);
  if (t === 'pekerja' && k === 'kode') return `<a href="#" onclick="event.preventDefault();lihatQR('${esc(r.id)}')">${esc(kodePek(r))}</a>`;
  if (!f) return esc(v);
  if (f.t === 'date') return esc(fD(v));
  if (f.t === 'rp') return v === '' || v == null ? '' : fmtRp(v);
  if (f.t === 'num') return v === '' || v == null ? '' : fmtN(v, 2).replace(/,00$/, '');
  if (f.t === 'obj') return esc(objLbl(v));
  if (f.t === 'foto') return v ? `<img class="thumb" src="${fotoSrc(v, 120)}" onclick="lihatFoto('${esc(v)}')">` : '';
  if (f.t === 'fotos') return thumbs(v);
  if (f.t === 'area') return esc(String(v || '')).slice(0, 220).replace(/\n/g, '<br>');
  if (k === 'status' || k === 'hasil' || k === 'kondisi' || k === 'posisi' || k === 'beban') {
    const c = /Aktif|AKTIF|Disetujui|Diterima|Selesai|Baik|Ya$/.test(v) ? 'ok' : /Menunggu|KONFIRMASI|Belum|Terbuka|Draft|Rusak ringan|Di /.test(v) ? 'warn' : /Ditolak|Rusak|Hilang|BATAL|Resign|Keluar|Dikembalikan|Tidak/.test(v) ? 'bad' : 'gr';
    return v ? `<span class="b ${c}">${esc(v)}</span>` : '';
  }
  if (k === 'link' && v) return `<a href="${esc(v)}" target="_blank">buka</a>`;
  return esc(v);
}
function badgeSt(p) {
  if (!p.badge) return '<span class="b bad">Belum ada</span>';

}
function kolLabel(t, k) { return { _siap: 'Status', _waste: 'Waste', _badge: 'Status badge', _rek: 'Rekening' }[k] || (SK[t].f.find(x => x.k === k) || {}).l || k; }
function nilaiPolos(t, k, r) {
  const f = (SK[t]?.f || []).find(x => x.k === k); const v = r[k];
  if (k === '_siap') return r.tglMpj && r.tglMp && r.tglKie ? 'Siap cor' : 'Belum lengkap';
  if (k === '_waste') { const a = num(r.volT), b = num(r.volD); return a && b ? +((b - a) / a * 100).toFixed(1) : ''; }
  if (k === '_badge') return badgeSt(r).replace(/<[^>]+>/g, '');

  if (!f) return v ?? '';
  if (f.t === 'obj') return objLbl(v);

}

/* ================= GRAFIK KURVA S ================= */
function kurvaData(paket) {
  const p = cfg('proyek'), B = cfg('bobot'), ds = [];
  for (let d = p.mulai; d <= p.selesai && ds.length < 400; d = addD(d, 1)) ds.push(d);
  const rs = rows('progres').sort((a, b) => a.tgl < b.tgl ? -1 : a.tgl > b.tgl ? 1 : num(a._ubah) - num(b._ubah));
  const m = {}, t = today(), plan = [], act = []; let i = 0;
  const filt = paket ? (o => o.paket === paket) : null;
  const objs = objAll().filter(o => hitung(o) && (!filt || filt(o)));
  const W = objs.reduce((a, o) => a + bobotObj(o), 0);
  for (const d of ds) {
    while (i < rs.length && rs[i].tgl <= d) { const r = rs[i++]; (m[r.obj] || (m[r.obj] = {}))[r.tahap] = Math.max(0, Math.min(100, num(r.pct))); }
    plan.push(rencanaPct(d, paket));
    if (d <= t) { let s = 0; for (const o of objs) s += bobotObj(o) * objPctB(o, m, B); act.push(W ? s / W : 0); } else act.push(null);
  }
  return { ds, plan, act };
}
function objPctB(o, pm, B) {
  const b = B[setKey(o)] || {}; const p = pm[o.id] || {}; let s = 0, w = 0;
  for (const [k] of setTahap(o)) { const bw = num(b[k]); w += bw; s += bw * (p[k] || 0) / 100; }
  return w ? s / w * 100 : 0;
}
function kurvaSVG(kd, o = {}) {
  const W = o.w || 820, H = o.h || 300, L = 42, R = 14, T = 16, Bm = 38;
  const n = kd.ds.length; if (!n) return '';
  const x = i => L + (W - L - R) * (n === 1 ? 0 : i / (n - 1)), y = v => T + (H - T - Bm) * (1 - v / 100);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;font:11px system-ui,Arial" role="img" aria-label="Kurva S">`;
  for (let v = 0; v <= 100; v += 20) s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#e3e8ee"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" fill="#6b7785">${v}%</text>`;
  kd.ds.forEach((d, i) => { if (i % 7 === 0 || i === n - 1) s += `<line x1="${x(i)}" x2="${x(i)}" y1="${T}" y2="${H - Bm}" stroke="#f0f2f5"/><text x="${x(i)}" y="${H - Bm + 14}" text-anchor="middle" fill="#6b7785">${pad(pd(d).getDate())}/${BLN[pd(d).getMonth()]}</text>`; });
  const ti = kd.ds.indexOf(today());
  if (ti >= 0) s += `<line x1="${x(ti)}" x2="${x(ti)}" y1="${T}" y2="${H - Bm}" stroke="#E07B24" stroke-dasharray="3 3"/><text x="${x(ti) + 3}" y="${T + 10}" fill="#E07B24">hari ini</text>`;
  s += `<polyline fill="none" stroke="#8a97a8" stroke-width="2.2" stroke-dasharray="6 4" points="${kd.plan.map((v, i) => x(i) + ',' + y(v)).join(' ')}"/>`;
  const pa = kd.act.map((v, i) => v === null ? null : x(i) + ',' + y(v)).filter(Boolean);
  if (pa.length) s += `<polyline fill="none" stroke="#1F3A5F" stroke-width="2.6" points="${pa.join(' ')}"/>`;
  const li = kd.act.reduce((a, v, i) => v === null ? a : i, -1);
  if (li >= 0) s += `<circle cx="${x(li)}" cy="${y(kd.act[li])}" r="4" fill="#1F3A5F"/><text x="${x(li) + 6}" y="${y(kd.act[li]) - 6}" fill="#1F3A5F" font-weight="700">${fmtN(kd.act[li], 1)}%</text>`;
  s += `<g transform="translate(${L + 6},${H - 10})"><line x1="0" x2="22" y1="-4" y2="-4" stroke="#8a97a8" stroke-width="2.2" stroke-dasharray="6 4"/><text x="27" y="0" fill="#333">Rencana</text><line x1="90" x2="112" y1="-4" y2="-4" stroke="#1F3A5F" stroke-width="2.6"/><text x="117" y="0" fill="#333">Realisasi</text></g>`;
  return s + '</svg>';
}

function warnaProg(v, o) { if (o.status !== 'AKTIF') return '#f1d7d3'; return v >= 99.99 ? '#1f8a4c' : v > 0 ? '#2f6fb5' : '#c9d1db'; }

function opsiTahapUntuk(ids) {
  const os = ids.map(objGet).filter(Boolean);

/* ================= MINGGUAN ================= */
let MG = null;
function akhirMinggu(d) { const co = cfg('cutoff'); let x = d; for (let i = 0; i < 7; i++) { if (pd(x).getDay() === co) return x; x = addD(x, 1); } return d; }

  <div class="kpi"><div class="l">Titik selesai bulan ini</div><div class="v">${objAll().filter(o => hitung(o) && objPctB(o, pmE, B) >= 99.99 && objPctB(o, pmS, B) < 99.99).length}</div></div>
  <div class="kpi"><div class="l">Hari kerja / man-day</div><div class="v">${hk} <span style="font-size:14px">/ ${md}</span></div><div class="s">rata-rata ${hk ? fmtN(md / hk, 1) : 0} pekerja/hari</div></div>
  <div class="kpi"><div class="l">TBM / peserta</div><div class="v">${tbm.length} <span style="font-size:14px">/ ${tbm.reduce((a, r) => a + jsonArr(r.peserta).length, 0)}</span></div></div>

async function periksaSinkron() {
  const L = []; const tulis = () => { const m = $('#cekBox'); if (m) m.innerHTML = L.map(([ok, t]) => `<div>${ok === null ? '⏳' : ok ? '✅' : '❌'} ${esc(t)}</div>`).join(''); };

  const run = async (t, f) => { L.push([null, t]); tulis(); try { const r = await f(); L[L.length - 1] = [true, t + (r ? ' — ' + r : '')]; } catch (e) { L[L.length - 1] = [false, t + ' — ' + e.message]; } tulis(); };

}

function editorBaris(el, kol, data) {

    $$('input[data-i]', el).forEach(inp => inp.oninput = () => { D[+inp.dataset.i][inp.dataset.k] = inp.value; });
    $$('[data-x]', el).forEach(b => b.onclick = () => { D.splice(+b.dataset.x, 1); if (!D.length) D.push({}); draw(); });
    $('[data-add]', el).onclick = () => { D.push({}); draw(); const l = $$('input[data-i]', el); if (l.length) l[l.length - kol.length].focus(); };

}

/* ---- editor peserta (absensi MP / MPJ / AEN) ---- */
function editorPeserta(el, data, opt = {}) {
  const L = data.map(x => Object.assign({}, x));
  let panel = '';
  const P = () => rows('pekerja').filter(p => p.status === 'Aktif').sort((a, b) => a.nama.localeCompare(b.nama));
  const ada = p => L.some(x => (x.pek && x.pek === p.id) || x.nama.toLowerCase() === p.nama.toLowerCase());
  const tambahPek = p => { if (!ada(p)) L.push({ pek: p.id, nama: p.nama, perusahaan: p.perusahaan || 'AEN', jabatan: p.jabatan || '' }); };
  const draw = () => {
    const hasil = opt.hasil;
    const rekap = PERUSAHAAN.map(c => [c, L.filter(x => x.perusahaan === c).length]).filter(x => x[1]).map(([c, n]) => c + ' ' + n).join(' · ');
    el.innerHTML = `<div class="row" style="margin-bottom:6px"><button class="btn sm" type="button" data-pk>+ Pilih dari pekerja</button><button class="btn sm" type="button" data-hadir>+ Semua yang hadir (absensi tanggal ini)</button><button class="btn sm" type="button" data-luar>+ Peserta MP / MPJ / KIE / tamu</button><span class="small mut">${L.length} peserta${rekap ? ' — ' + rekap : ''}</span></div>
    <div data-panel>${panel === 'pk' ? `<div class="card" style="padding:8px;margin-bottom:8px"><input class="inp sm" data-q placeholder="Cari nama" style="width:100%;margin-bottom:6px"><div class="objlist" style="max-height:220px">${P().map(p => `<label class="${ada(p) ? 'dn' : ''}"><input type="checkbox" value="${esc(p.id)}" ${ada(p) ? 'disabled checked' : ''}>${esc(p.nama)} <span class="mut">${esc(p.jabatan || '')}</span></label>`).join('') || '<span class="mut small">Belum ada data pekerja.</span>'}</div><div class="row end" style="margin-top:6px"><button class="btn sm" type="button" data-tutup>Tutup</button><button class="btn sm pri" type="button" data-ok>Tambahkan terpilih</button></div></div>` : ''}</div>
    <div class="tw"><table class="t"><thead><tr><th>No</th><th>Nama</th><th>Perusahaan</th><th>Jabatan</th>${hasil ? '<th>Hasil MCU</th><th>Tes narkoba</th><th>Berlaku s/d</th>' : ''}<th></th></tr></thead><tbody>${L.map((p, i) => `<tr><td>${i + 1}</td><td><input class="inp sm" data-i="${i}" data-k="nama" value="${esc(p.nama || '')}" style="width:150px"></td><td><select class="inp sm" data-i="${i}" data-k="perusahaan">${PERUSAHAAN.map(o => `<option ${o === p.perusahaan ? 'selected' : ''}>${o}</option>`).join('')}</select></td><td><input class="inp sm" data-i="${i}" data-k="jabatan" value="${esc(p.jabatan || '')}" list="dlJab" style="width:130px"></td>${hasil ? `<td><select class="inp sm" data-i="${i}" data-k="mcu">${['', 'Fit', 'Fit dengan catatan', 'Unfit'].map(o => `<option ${o === (p.mcu || '') ? 'selected' : ''}>${o}</option>`).join('')}</select></td><td><select class="inp sm" data-i="${i}" data-k="narkoba">${['', 'Negatif', 'Positif'].map(o => `<option ${o === (p.narkoba || '') ? 'selected' : ''}>${o}</option>`).join('')}</select></td><td><input type="date" class="inp sm" data-i="${i}" data-k="berlaku" value="${esc(p.berlaku || '')}"></td>` : ''}<td><button class="btn sm del" type="button" data-x="${i}">×</button></td></tr>`).join('') || `<tr><td colspan="8" class="mut">Belum ada peserta.</td></tr>`}</tbody></table></div><datalist id="dlJab">${JABATAN.concat(['HSE', 'Operator Crane', 'Welder', 'PM', 'Pengawas']).map(o => `<option value="${esc(o)}">`).join('')}</datalist>`;
    $$('[data-i]', el).forEach(inp => { inp.oninput = inp.onchange = () => { L[+inp.dataset.i][inp.dataset.k] = inp.value; }; });
    $$('[data-x]', el).forEach(b => b.onclick = () => { L.splice(+b.dataset.x, 1); draw(); });
    $('[data-pk]', el).onclick = () => { panel = panel === 'pk' ? '' : 'pk'; draw(); };
    $('[data-luar]', el).onclick = () => { L.push({ nama: '', perusahaan: 'MPJ', jabatan: '' }); draw(); const n = $$('input[data-k=nama]', el); n[n.length - 1].focus(); };
    $('[data-hadir]', el).onclick = () => {
      const tgl = ($('#f_tgl') || {}).value || today();
      const hadir = rows('absen').filter(r => r.tgl === tgl && /^H/.test(r.kode || '')).map(r => get('pekerja', r.pek)).filter(Boolean);
      if (!hadir.length) return toast('Absensi tanggal ' + fD(tgl) + ' belum diisi', 'err');
      const n0 = L.length; hadir.forEach(tambahPek); toast((L.length - n0) + ' peserta ditambahkan dari absensi'); draw();
    };
    if (panel === 'pk') {
      const q = $('[data-q]', el); q.oninput = () => $$('.objlist label', el).forEach(l => l.style.display = l.textContent.toLowerCase().includes(q.value.toLowerCase()) ? '' : 'none');
      $('[data-tutup]', el).onclick = () => { panel = ''; draw(); };
      $('[data-ok]', el).onclick = () => { $$('.objlist input:not([disabled])', el).filter(c => c.checked).forEach(c => { const p = get('pekerja', c.value); if (p) tambahPek(p); }); panel = ''; draw(); };
    }
  };
  draw();
  return () => L.map(x => { const o = {}; for (const k of Object.keys(x)) o[k] = String(x[k] ?? '').trim(); return o; }).filter(x => x.nama);
}

/* ---- absensi: cari / scan kode pekerja ---- */
function pasangScanAbsen() {
  const box = $('#abScan'); if (!box) return;
  const cari = v => {
    v = String(v || '').trim().toLowerCase(); if (!v) return;
    const p = rows('pekerja').find(x => kodePek(x).toLowerCase() === v || (x.badge || '').toLowerCase() === v) || rows('pekerja').find(x => x.nama.toLowerCase().includes(v));
    const s = p && $(`[data-p="${CSS.escape(p.id)}"]`);
    if (!s) return toast('Pekerja "' + v + '" tidak ada di daftar tanggal ini', 'err');
    if (!s.value) s.value = 'H'; s.dispatchEvent(new Event('change'));
    const tr = s.closest('tr'); tr.scrollIntoView({ block: 'center' }); tr.style.background = '#e1f3e8'; setTimeout(() => tr.style.background = '', 2500);
    toast(p.nama + ' → ' + s.value + ' (jangan lupa Simpan absensi)');
  };
  const inp = $('#abKode'); inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); cari(inp.value); inp.value = ''; } };
  const bc = $('#abCam');
  if (bc) bc.onclick = async () => {
    let stream, stop = false;
    const m = modal('Scan QR pekerja', '<video id="scV" playsinline style="width:100%;border-radius:8px;background:#000"></video><p class="small mut">Arahkan kamera ke QR di kartu pekerja. Setiap QR yang terbaca langsung diisi H.</p>');
    const tutup0 = tutupModal; const selesai = () => { stop = true; if (stream) stream.getTracks().forEach(t => t.stop()); };
    $('.x', m).addEventListener('click', selesai);
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      const v = $('#scV', m); v.srcObject = stream; await v.play();
      const det = new BarcodeDetector({ formats: ['qr_code'] }); let last = '';
      const loop = async () => { if (stop || !document.body.contains(v)) return selesai(); try { const r = await det.detect(v); if (r[0] && r[0].rawValue !== last) { last = r[0].rawValue; cari(last); } } catch (e) { } setTimeout(loop, 350); };
      loop();
    } catch (e) { toast('Kamera tidak bisa dibuka: ' + e.message, 'err'); selesai(); tutup0(); }
  };
}

/* ---- terbilang ---- */
function terbilang(n) {
  n = Math.floor(Math.abs(num(n)));
  const s = ['', 'satu', 'dua', 'tiga', 'empat', 'lima', 'enam', 'tujuh', 'delapan', 'sembilan', 'sepuluh', 'sebelas'];
  const f = x => x < 12 ? s[x] : x < 20 ? f(x - 10) + ' belas' : x < 100 ? f(Math.floor(x / 10)) + ' puluh ' + f(x % 10) : x < 200 ? 'seratus ' + f(x - 100) : x < 1000 ? f(Math.floor(x / 100)) + ' ratus ' + f(x % 100) : x < 2000 ? 'seribu ' + f(x - 1000) : x < 1e6 ? f(Math.floor(x / 1000)) + ' ribu ' + f(x % 1000) : x < 1e9 ? f(Math.floor(x / 1e6)) + ' juta ' + f(x % 1e6) : f(Math.floor(x / 1e9)) + ' miliar ' + f(x % 1e9);
  const t = f(n).replace(/\s+/g, ' ').trim();
  return (t ? t.charAt(0).toUpperCase() + t.slice(1) : 'Nol') + ' rupiah';
}

/* ---- hitung upah dari absensi (rumus sama dengan Rekap Upah) ---- */
function hitungUpah(s, e) {
  const jk = num(cfg('jamKerja')) || 7;
  const ab = rows('absen').filter(r => r.tgl >= s && r.tgl <= e);
  const P = rows('pekerja').filter(p => ab.some(r => r.pek === p.id)).sort((a, b) => a.nama.localeCompare(b.nama));
  return P.map(p => {
    let hd = 0, jl = 0, iz = 0, sk = 0, al = 0;
    ab.filter(r => r.pek === p.id).forEach(r => { const k = r.kode || ''; if (/^H/.test(k)) { hd++; jl += num(k.split('-')[1]); } else if (k === 'I') iz++; else if (k === 'S') sk++; else if (k === 'A') al++; });
    const tl = num(p.lembur) || Math.round(num(p.upah) / jk);
    const pok = hd * num(p.upah), lem = jl * tl;
    return { p, hd, jl, iz, sk, al, tl, pok, lem };
  });
}

const urutBbm = (a, b) => (a.tgl < b.tgl ? -1 : a.tgl > b.tgl ? 1 : 0) || num(a.odo) - num(b.odo);

/* ---- rumus: metode isi penuh ke isi penuh ---- */
function hitungBbm(nopol) {
  const std = num(kendDari(nopol).standar) || 9;
  const L = rows('bbmk').filter(r => r.nopol === nopol).sort(urutBbm);
  let prev = null, full = null, accL = 0, accRp = 0;
  return L.map(r => {
    const o = { r, std, liter: num(r.liter), total: num(r.total), hl: num(r.liter) ? num(r.total) / num(r.liter) : 0, jarak: null, rasio: null, rpkm: null, st: '', cls: 'gr' };
    if (!prev) { o.st = 'Data awal'; if (r.full !== 'Tidak') full = r; prev = r; return o; }
    o.jarak = num(r.odo) - num(prev.odo);
    if (o.jarak <= 0) { o.st = 'Cek odometer'; o.cls = 'bad'; o.jarak = null; return o; }
    o.rpkm = num(r.total) / o.jarak;
    accL += o.liter; accRp += o.total;
    if (r.full === 'Tidak' || !full) { o.st = r.full === 'Tidak' ? 'Isi sebagian' : 'Data awal (penuh)'; o.cls = 'gr'; if (r.full !== 'Tidak') { full = r; accL = 0; accRp = 0; } prev = r; return o; }
    o.rasio = (num(r.odo) - num(full.odo)) / accL;
    const p = o.rasio / std;
    if (p >= 1) { o.st = 'Wajar'; o.cls = 'ok'; } else if (p >= 0.85) { o.st = 'Perhatian'; o.cls = 'warn'; } else { o.st = 'Boros — periksa'; o.cls = 'bad'; }
    full = r; accL = 0; accRp = 0; prev = r; return o;
  });
}
function dataBbm(bln, nopol) {
  const K = nopol ? [nopol] : [...new Set(rows('kendaraan').map(r => r.nopol).concat(rows('bbmk').map(r => r.nopol)))].filter(Boolean).sort();
  const L = K.flatMap(k => hitungBbm(k)).filter(o => !bln || o.r.tgl.slice(0, 7) === bln);
  return L.sort((a, b) => a.r.tgl < b.r.tgl ? -1 : a.r.tgl > b.r.tgl ? 1 : num(a.r.odo) - num(b.r.odo));
}
function ringkasBbm(L) {
  const R = L.filter(o => o.rasio != null), km = L.reduce((a, o) => a + (o.jarak > 0 ? o.jarak : 0), 0);
  const lR = R.reduce((a, o) => a + o.liter, 0), kmR = R.reduce((a, o) => a + o.rasio * o.liter, 0);
  const liter = L.reduce((a, o) => a + o.liter, 0), biaya = L.reduce((a, o) => a + o.total, 0);
  return { n: L.length, liter, biaya, km, rata: lR ? kmR / lR : null, rpkm: km ? L.filter(o => o.jarak > 0).reduce((a, o) => a + o.total, 0) / km : null, hl: liter ? biaya / liter : 0, boros: L.filter(o => o.cls === 'bad').length, perhatian: L.filter(o => o.cls === 'warn').length };
}

function grafikBbm(nopol) {

  L.forEach((o, i) => { s += `<rect x="${x(i) - bw / 2}" y="${y(o.rasio)}" width="${bw}" height="${pt + ih - y(o.rasio)}" rx="3" fill="${warna[o.cls] || '#8aa'}"><title>${fD(o.r.tgl)}: ${fmtN(o.rasio, 2)} km/L</title></rect><text x="${x(i)}" y="${y(o.rasio) - 4}" text-anchor="middle" fill="#333">${fmtN(o.rasio, 1)}</text><text x="${x(i)}" y="${H - pb + 14}" text-anchor="middle" fill="#666">${o.r.tgl.slice(8)}/${o.r.tgl.slice(5, 7)}</text>`; });

}
function rekapBulanBbm(nopol) {

}
