<style>:root{--navy:#1F3A5F;--navy2:#2c5282;--acc:#E07B24;--bg:#f3f5f8;--card:#fff;--line:#dde3ea;--tx:#1d2733;--mut:#6b7785;--ok:#1f8a4c;--warn:#c98a00;--bad:#c0392b;--blue:#2f6fb5;--p8:#d9a300;--p9:#3a3a3a;--p12:#2e8b3e}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}
a{color:var(--blue)}
.hidden{display:none!important}
/* top */
#top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;padding:8px 14px;min-height:52px}
#top .ttl{font-weight:700;line-height:1.15}
#top .ttl small{display:block;font-weight:400;opacity:.75;font-size:11.5px}
#top .sp{flex:1}
#burger{background:none;border:0;color:#fff;font-size:22px;cursor:pointer;padding:2px 6px}
.chip{border-radius:20px;padding:4px 10px;font-size:12px;cursor:pointer;border:1px solid rgba(255,255,255,.35);white-space:nowrap;background:rgba(255,255,255,.1);color:#fff}
.chip.ok{background:#1f8a4c;border-color:#1f8a4c}.chip.wait{background:#c98a00;border-color:#c98a00}.chip.bad{background:#c0392b;border-color:#c0392b}
#userbtn{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* layout */
#wrap{display:flex;min-height:calc(100vh - 52px)}
#nav{width:236px;background:#fff;border-right:1px solid var(--line);padding:8px 0;flex-shrink:0;overflow:auto;position:sticky;top:52px;height:calc(100vh - 52px)}
#nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);padding:10px 16px 4px}
#nav a{display:block;padding:8px 16px;color:var(--tx);text-decoration:none;border-left:3px solid transparent;cursor:pointer}
#nav a:hover{background:#f1f4f8}
#nav a.on{background:#eaf0f7;border-left-color:var(--acc);font-weight:600;color:var(--navy)}
#main{flex:1;min-width:0;padding:16px 18px 60px}
@media(max-width:899px){#nav{position:fixed;left:-260px;top:52px;z-index:40;transition:left .2s;box-shadow:2px 0 12px rgba(0,0,0,.15)}#nav.open{left:0}#main{padding:12px 10px 60px}}
@media(min-width:900px){#burger{display:none}}
h1{font-size:20px;margin:2px 0 12px;color:var(--navy)}
h2{font-size:16px;margin:0 0 10px;color:var(--navy)}
h3{font-size:14px;margin:12px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi .l{font-size:12px;color:var(--mut)}
.kpi .v{font-size:22px;font-weight:700;color:var(--navy);line-height:1.2}
.kpi .s{font-size:12px;color:var(--mut)}
.kpi.bad .v{color:var(--bad)}.kpi.ok .v{color:var(--ok)}.kpi.warn .v{color:var(--warn)}
.btn{background:#fff;border:1px solid #c6cfda;border-radius:8px;padding:7px 12px;cursor:pointer;color:var(--tx);white-space:nowrap}
.btn:hover{background:#f3f6f9}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.del{color:var(--bad);border-color:#e3b3ad}
.btn.sm{padding:3px 8px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.5;cursor:default}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;border-bottom:3px solid transparent;color:var(--mut)}
.tabs button.on{border-bottom-color:var(--acc);color:var(--navy);font-weight:600}
.tw{overflow:auto;max-width:100%;border:1px solid var(--line);border-radius:8px;background:#fff}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{background:#eef2f7;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:1}
table.t td{padding:6px 8px;border-bottom:1px solid #edf0f4;vertical-align:top}
table.t tr:hover td{background:#fafbfd}
table.t td.n,table.t th.n{text-align:right;white-space:nowrap}
table.t tfoot td{font-weight:700;background:#f6f8fb}
.tw.tall{max-height:65vh}
.mut{color:var(--mut)}.small{font-size:12px}
.b{display:inline-block;border-radius:10px;padding:1px 8px;font-size:11.5px;font-weight:600;white-space:nowrap}
.b.ok{background:#e1f3e8;color:#1f6b3c}.b.warn{background:#fdf1d6;color:#8a6100}.b.bad{background:#fbe3e0;color:#9b2c20}.b.info{background:#e3edf9;color:#24558f}.b.gr{background:#eceff3;color:#56616e}
.p8{background:#fff4cc;color:#7a5c00}.p9{background:#e6e6e6;color:#222}.p12{background:#dff0e2;color:#1d5c29}
.bar{height:9px;background:#e6ebf1;border-radius:6px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--ok)}
.fld{display:flex;flex-direction:column;gap:3px;margin-bottom:10px;min-width:0}
.fld label{font-size:12px;color:var(--mut);font-weight:600}
.fld input,.fld select,.fld textarea,.inp{border:1px solid #c6cfda;border-radius:7px;padding:7px 9px;background:#fff;width:100%;min-width:0}
.fld textarea{min-height:70px;resize:vertical}
.inp.sm{padding:4px 6px;width:auto}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 12px}
.alert{border-radius:8px;padding:9px 12px;margin-bottom:10px;font-size:13px}
.alert.warn{background:#fff6de;border:1px solid #f0d58c}.alert.bad{background:#fdeceb;border:1px solid #efbdb7}.alert.info{background:#eaf2fc;border:1px solid #bcd3ef}
/* modal */
#modal{position:fixed;inset:0;background:rgba(15,25,40,.45);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:4vh 10px;overflow:auto}
#modal .box{background:#fff;border-radius:12px;width:100%;max-width:640px;padding:16px 18px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
#modal .box.wide{max-width:960px}
#modal .hd{display:flex;align-items:center;margin-bottom:10px}
#modal .hd h2{flex:1;margin:0}
#modal .x{background:none;border:0;font-size:22px;cursor:pointer;color:var(--mut)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center}
#toast div{background:#243447;color:#fff;padding:9px 16px;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.25);font-size:13px;max-width:90vw}
#toast div.err{background:var(--bad)}

.logos{display:flex;justify-content:center;align-items:center;gap:14px;margin-bottom:12px;min-height:54px}
.logos img{max-height:48px;max-width:110px;object-fit:contain}

.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.keys button{padding:12px;font-size:19px;border-radius:10px;border:1px solid #d5dce5;background:#f7f9fb;cursor:pointer}

.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}

.gal img{width:100%;height:120px;object-fit:cover;display:block;cursor:pointer;background:#eef1f5}
.gal figcaption{padding:5px 7px;font-size:11.5px}
.thumb{width:44px;height:44px;object-fit:cover;border-radius:5px;cursor:pointer;background:#eef1f5;vertical-align:middle}

#cetak{display:none}

  #cetak{display:block}

.doc table{border-collapse:collapse;width:100%;margin-bottom:4px}

.doc td.n{text-align:right}

function objAll() {
  const a = rows('titik').map(r => Object.assign({ jenis: 'titik' }, r));
  const b = rows('tb').map(r => Object.assign({ jenis: 'tb' }, r));
  return a.concat(b).sort((x, y) => (x.jenis === y.jenis ? 0 : x.jenis === 'titik' ? -1 : 1) || ['9', '8', '12'].indexOf(x.paket) - ['9', '8', '12'].indexOf(y.paket) || String(x.no).localeCompare(String(y.no), 'id', { numeric: true }));

}

  let s = 0, w = 0; const B = cfg('bobot');

const sCurve = x => x <= 0 ? 0 : x >= 1 ? 1 : 3 * x * x - 2 * x * x * x;

async function api(aksi, data = {}, ms = 90000) {

  try {
    const r = await fetch(S.cfg.url, { method: 'POST', body: JSON.stringify(Object.assign({ token: S.cfg.token, aksi }, data)), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow', signal: ctl.signal });
    if (r.status === 404) throw new Error('Alamat server tidak ditemukan (404). Periksa URL /exec atau deploy ulang.');

    if (!j.ok) throw new Error(j.err || 'Server menolak');

async function unggahFoto() {
  for (const key of Object.keys(S.pend)) {
    const p = S.pend[key]; if (!p || !p.data) { delete S.pend[key]; continue; }
    const m = /^data:([^;]+);base64,(.*)$/.exec(p.data); if (!m) { delete S.pend[key]; continue; }
    const j = await api('foto', { nama: p.nama || key + '.jpg', mime: m[1], data: m[2], bulan: (p.tgl || today()).slice(0, 7) }, 120000);
    const r = TB_(p.t)[p.id];

async function kirim() {
  const keys = Object.keys(S.dirty); if (!keys.length) return;
  for (let i = 0; i < keys.length; i += 250) {
    const part = keys.slice(i, i + 250);
    const baris = part.map(k => { const [t, ...id] = k.split('|'); return { t, r: TB_(t)[id.join('|')] }; }).filter(b => b.r);
    const ub = baris.map(b => b.r._ubah);
    const j = await api('simpan', { baris });
    baris.forEach((b, x) => { const k = b.t + '|' + b.r.id; const cur = TB_(b.t)[b.r.id]; if (cur && cur._ubah === ub[x]) delete S.dirty[k]; });
    if (j.ditolak && j.ditolak.length) S.srv = 0;

}
async function tarik() {
  const j = await api('muat', { sejak: S.srv || 0 });
  let ubah = 0;
  for (const [t, rs] of Object.entries(j.data || {})) {
    for (const r of rs) {
      if (!r.id) continue;
      const k = t + '|' + r.id, L = TB_(t)[r.id];
      if (S.dirty[k] && L && num(L._ubah) > num(r._ubah)) continue;
      if (L && num(L._ubah) === num(r._ubah) && L._hapus === r._hapus) { delete S.dirty[k]; continue; }
      TB_(t)[r.id] = r; delete S.dirty[k]; ubah++;
    }
  }
  S.srv = Math.max(0, num(j.waktu) - 120000);
  persist();

}
async function sinkron(paksa) {

    if (u || paksa) segarkan();

}

  if (!v) return '';
  if (v.startsWith('drive:')) return `https://drive.google.com/thumbnail?id=${v.slice(6)}&sz=w${w}`;
  if (v.startsWith('pend:')) { const p = S.pend[v.slice(5)]; return p ? p.data : ''; }

function kompres(file, max = 1280, q = .8) {
  return new Promise((ok, no) => {
    const fr = new FileReader();
    fr.onload = () => { const im = new Image(); im.onload = () => { let { width: w, height: h } = im; const s = Math.min(1, max / Math.max(w, h)); w = Math.round(w * s); h = Math.round(h * s); const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(im, 0, 0, w, h); ok(c.toDataURL('image/jpeg', q)); }; im.onerror = no; im.src = fr.result; };
    fr.onerror = no; fr.readAsDataURL(file);
  });
}

function cekObj(t) {
  return n => {
    if (rows('titik').concat(rows('tb')).some(r => r.id !== n.id && r.kode.toLowerCase() === n.kode.toLowerCase())) return 'Kode "' + n.kode + '" sudah dipakai';
    if (rows(t).some(r => r.id !== n.id && r.no.toLowerCase() === n.no.toLowerCase())) return 'No. urut "' + n.no + '" sudah dipakai';
    return '';
  };
}
function sebelumObj(t) {
  return (n, baru) => {
    if (baru && !TB_(t)[n.kode] && !TB_(t === 'titik' ? 'tb' : 'titik')[n.kode]) n.id = n.kode;
    if (t === 'titik' && SEED && (n.x === undefined || n.x === '')) {
      const m = /^([A-J])\s*\/\s*(\d{1,2})$/i.exec(n.grid || '');
      if (m && SEED.grid.X[m[2]] !== undefined) { n.x = SEED.grid.X[m[2]]; n.y = SEED.grid.Y[m[1].toUpperCase()]; }
    }
    if (t === 'tb' && num(n.panjang) > 0 && !(num(n.vol) > 0)) { const a = { TB1: .175, TB2: .15, TB4: .08 }[n.tipe]; if (a) n.vol = String(+(num(n.panjang) * a).toFixed(3)); }
    if (baru && !n.urut) n.urut = String(rows(t).length + 1);
  };
}
SK.titik.cek = cekObj('titik'); SK.titik.sebelum = sebelumObj('titik');
SK.tb.cek = cekObj('tb'); SK.tb.sebelum = sebelumObj('tb');

/* ---- format sel ---- */
function selNilai(t, k, r) {
  const f = (SK[t]?.f || []).find(x => x.k === k);
  const v = r[k];
  if (k === '_siap') { const ok = r.tglMpj && r.tglMp && r.tglKie; return ok ? '<span class="b ok">Siap cor</span>' : '<span class="b warn">Belum lengkap</span>'; }
  if (k === '_waste') { const a = num(r.volT), b = num(r.volD); if (!a || !b) return ''; const w = (b - a) / a * 100; return `<span class="b ${w > 5 ? 'bad' : w > 2 ? 'warn' : 'ok'}">${fmtN(w, 1)}%</span>`; }
  if (k === '_badge') return badgeSt(r);
  if (k === 'paket') return bPaket(v);
  if (!f) return esc(v);
  if (f.t === 'date') return esc(fD(v));
  if (f.t === 'rp') return v === '' || v == null ? '' : fmtRp(v);
  if (f.t === 'num') return v === '' || v == null ? '' : fmtN(v, 2).replace(/,00$/, '');
  if (f.t === 'obj') return esc(objLbl(v));
  if (f.t === 'foto') return v ? `<img class="thumb" src="${fotoSrc(v, 120)}" onclick="lihatFoto('${esc(v)}')">` : '';
  if (f.t === 'area') return esc(String(v || '')).slice(0, 220).replace(/\n/g, '<br>');
  if (k === 'status' || k === 'hasil' || k === 'kondisi' || k === 'posisi' || k === 'beban') {
    const c = /Aktif|AKTIF|Disetujui|Diterima|Selesai|Baik|Ya$/.test(v) ? 'ok' : /Menunggu|KONFIRMASI|Belum|Terbuka|Draft|Rusak ringan|Di /.test(v) ? 'warn' : /Ditolak|Rusak|Hilang|BATAL|Resign|Keluar|Dikembalikan|Tidak/.test(v) ? 'bad' : 'gr';
    return v ? `<span class="b ${c}">${esc(v)}</span>` : '';
  }
  if (k === 'link' && v) return `<a href="${esc(v)}" target="_blank">buka</a>`;
  return esc(v);
}
function badgeSt(p) {
  if (!p.badge) return '<span class="b bad">Belum ada</span>';
  if (!p.badgeS) return '<span class="b warn">Tanpa masa berlaku</span>';
  const d = diffD(today(), p.badgeS);
  if (d < 0) return '<span class="b bad">Kedaluwarsa</span>';
  if (d <= 14) return `<span class="b warn">${d} hari lagi</span>`;
  return '<span class="b ok">Berlaku</span>';
}
function kolLabel(t, k) { return { _siap: 'Status', _waste: 'Waste', _badge: 'Status badge' }[k] || (SK[t].f.find(x => x.k === k) || {}).l || k; }
function nilaiPolos(t, k, r) {
  const f = (SK[t]?.f || []).find(x => x.k === k); const v = r[k];
  if (k === '_siap') return r.tglMpj && r.tglMp && r.tglKie ? 'Siap cor' : 'Belum lengkap';
  if (k === '_waste') { const a = num(r.volT), b = num(r.volD); return a && b ? +((b - a) / a * 100).toFixed(1) : ''; }
  if (k === '_badge') return badgeSt(r).replace(/<[^>]+>/g, '');
  if (!f) return v ?? '';
  if (f.t === 'obj') return objLbl(v);
  if (f.t === 'rp' || f.t === 'num') return v === '' || v == null ? '' : num(v);
  if (f.t === 'foto') return v && v.startsWith('drive:') ? 'https://drive.google.com/file/d/' + v.slice(6) + '/view' : (v ? 'belum terunggah' : '');
  if (f.t === 'date') return fD(v);
  return v ?? '';
}

/* ---- pemilih objek ---- */
function opsiObj(sel, kosong = true) {
  const g = { '9': [], '8': [], '12': [] };
  for (const o of objAll()) (g[o.paket] || (g[o.paket] = [])).push(o);
  let h = kosong ? '<option value="">— pilih —</option>' : '';
  for (const p of Object.keys(g)) {
    if (!g[p].length) continue;
    h += `<optgroup label="Paket ${p} — titik">` + g[p].filter(o => o.jenis === 'titik').map(o => `<option value="${esc(o.id)}" ${o.id === sel ? 'selected' : ''}>${esc(o.no + ' · ' + o.kode)}${o.status !== 'AKTIF' ? ' (' + o.status + ')' : ''}</option>`).join('') + '</optgroup>';
    h += `<optgroup label="Paket ${p} — tie beam">` + g[p].filter(o => o.jenis === 'tb').map(o => `<option value="${esc(o.id)}" ${o.id === sel ? 'selected' : ''}>${esc(o.no + ' · ' + o.kode)}${o.status !== 'AKTIF' ? ' (' + o.status + ')' : ''}</option>`).join('') + '</optgroup>';
  }
  return h;
}

/* ---- form generik ---- */
function formTabel(t, row, preset = {}, after) {
  const sk = SK[t], baru = !row;
  const r = Object.assign({}, row || {});
  if (baru) { for (const f of sk.f) if (f.def !== undefined && r[f.k] === undefined) r[f.k] = typeof f.def === 'function' ? f.def() : f.def; Object.assign(r, preset); }
  const el = document.createElement('div');
  let h = '<div class="fgrid">';
  for (const f of sk.f) {
    const v = r[f.k] ?? '', id = 'f_' + f.k, st = f.w ? 'grid-column:1/-1' : '';
    h += `<div class="fld" style="${st}"><label for="${id}">${esc(f.l)}${f.req ? ' *' : ''}</label>`;
    if (f.t === 'area') h += `<textarea id="${id}">${esc(v)}</textarea>`;
    else if (f.t === 'sel') { const oo = typeof f.o === 'function' ? f.o(r) : f.o; h += `<select id="${id}"><option value=""></option>${oo.map(o => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}${v && !oo.includes(v) ? `<option selected>${esc(v)}</option>` : ''}</select>`; }
    else if (f.t === 'selx') { const oo = typeof f.o === 'function' ? f.o(r) : f.o; h += `<input id="${id}" list="dl_${f.k}" value="${esc(v)}"><datalist id="dl_${f.k}">${oo.map(o => `<option value="${esc(o)}">`).join('')}</datalist>`; }
    else if (f.t === 'obj') h += `<select id="${id}">${opsiObj(v)}</select>`;
    else if (f.t === 'foto') h += `<div class="row">${v ? `<img class="thumb" src="${fotoSrc(v, 120)}">` : ''}<input id="${id}" type="file" accept="image/*" capture="environment" style="max-width:220px">${v ? `<label class="small"><input type="checkbox" id="${id}_x"> hapus foto</label>` : ''}</div>`;
    else h += `<input id="${id}" type="${f.t === 'date' ? 'date' : f.t === 'time' ? 'time' : (f.t === 'num' || f.t === 'rp') ? 'number' : 'text'}" ${f.t === 'num' ? 'step="any"' : ''} ${f.t === 'rp' ? 'step="1"' : ''} value="${esc(v)}" placeholder="${esc(f.ph || '')}">`;
    h += '</div>';
  }
  h += '</div><div class="row end" style="margin-top:6px">' + (baru ? '' : '<span class="small mut" style="flex:1">' + (num(r._ubah) < 1e10 ? 'Data awal dari drawing' : 'Terakhir diubah ' + esc(fW(r._ubah)) + ' oleh ' + esc(r._oleh || '-')) + '</span>') + '<button class="btn" data-a="batal">Batal</button><button class="btn pri" data-a="simpan">Simpan</button></div>';
  el.innerHTML = h;
  modal((baru ? 'Tambah — ' : 'Ubah — ') + sk.judul, el, { lekat: true, wide: sk.f.length > 8 });
  $('[data-a=batal]', el).onclick = tutupModal;
  $('[data-a=simpan]', el).onclick = async () => {
    const n = Object.assign({}, r, { id: r.id || uid(t.slice(0, 2).toUpperCase()) });
    for (const f of sk.f) {
      const inp = $('#f_' + f.k, el);
      if (f.t === 'foto') {
        if ($('#f_' + f.k + '_x', el)?.checked) n[f.k] = '';
        if (inp.files && inp.files[0]) { try { n[f.k] = await simpanFotoBaru(inp.files[0], t, n.id, f.k, n.tgl); } catch (e) { toast('Foto gagal dibaca', 'err'); } }
        continue;
      }
      n[f.k] = inp.value.trim();
      if (f.req && !n[f.k]) { toast('Isian "' + f.l + '" wajib diisi', 'err'); inp.focus(); return; }
    }
    if (sk.cek) { const e = sk.cek(n); if (e) { toast(e, 'err'); return; } }
    if (sk.sebelum) sk.sebelum(n, baru);
    put(t, n); if (sk.sesudah) sk.sesudah(n, baru); tutupModal(); toast('Tersimpan'); if (after) after(n); else render();
  };
}

/* ---- halaman tabel generik ---- */
const FL = {};
function viewTabel(t, o = {}) {
  const sk = SK[t], ed = bisaEdit(t);

  const adaTgl = sk.f.some(x => x.k === 'tgl');

  if (o.filter) rs = rs.filter(o.filter);
  if (f.q) { const q = f.q.toLowerCase(); rs = rs.filter(r => sk.kol.some(k => String(nilaiPolos(t, k, r)).toLowerCase().includes(q))); }
  if (adaTgl && f.dari) rs = rs.filter(r => r.tgl >= f.dari);
  if (adaTgl && f.sampai) rs = rs.filter(r => r.tgl <= f.sampai);
  const uk = sk.urut || (adaTgl ? 'tgl' : '_ubah');
  rs.sort((a, b) => { const x = a[uk] ?? '', y = b[uk] ?? ''; const c = (isFinite(x) && isFinite(y) && x !== '' && y !== '') ? num(x) - num(y) : String(x).localeCompare(String(y), 'id', { numeric: true }); return sk.asc ? c : -c; });
  let h = `${o.noJudul ? '' : `<h1>${esc(sk.judul)}</h1>`}<p class="mut small">${esc(sk.ket || '')}</p>

  h += rs.map(r => `<tr>${sk.kol.map(k => `<td>${selNilai(t, k, r)}</td>`).join('')}${ed ? `<td style="white-space:nowrap"><button class="btn sm" data-ed="${esc(r.id)}">Ubah</button> <button class="btn sm del" data-del="${esc(r.id)}">Hapus</button></td>` : ''}</tr>`).join('') || `<tr><td colspan="${sk.kol.length + 1}" class="mut">Belum ada data.</td></tr>`;
  h += '</tbody></table></div>';
  const box = o.box || $('#main'); box.innerHTML = h;
  const q = $('#q_' + t, box); q.oninput = () => { f.q = q.value; clearTimeout(q._t); q._t = setTimeout(() => { viewTabel(t, o); const n = $('#q_' + t, box); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 300); };

  $('#xl_' + t, box).onclick = () => unduhExcel(sk.judul.replace(/\W+/g, '_') + '_' + today(), [[sk.judul, [sk.kol.map(k => kolLabel(t, k).replace(/<[^>]+>/g, '')).concat(['Diinput oleh', 'Waktu'])].concat(rs.map(r => sk.kol.map(k => nilaiPolos(t, k, r)).concat([r._oleh || '', fW(r._ubah)])))]]);
  if (ed) {

  }

/* ================= GRAFIK KURVA S ================= */
function kurvaData(paket) {
  const p = cfg('proyek'), B = cfg('bobot'), ds = [];
  for (let d = p.mulai; d <= p.selesai && ds.length < 400; d = addD(d, 1)) ds.push(d);
  const rs = rows('progres').sort((a, b) => a.tgl < b.tgl ? -1 : a.tgl > b.tgl ? 1 : num(a._ubah) - num(b._ubah));
  const m = {}, t = today(), plan = [], act = []; let i = 0;
  const filt = paket ? (o => o.paket === paket) : null;
  const objs = objAll().filter(o => hitung(o) && (!filt || filt(o)));
  const W = objs.reduce((a, o) => a + bobotObj(o), 0);
  for (const d of ds) {
    while (i < rs.length && rs[i].tgl <= d) { const r = rs[i++]; (m[r.obj] || (m[r.obj] = {}))[r.tahap] = Math.max(0, Math.min(100, num(r.pct))); }
    plan.push(rencanaPct(d, paket));
    if (d <= t) { let s = 0; for (const o of objs) s += bobotObj(o) * objPctB(o, m, B); act.push(W ? s / W : 0); } else act.push(null);
  }
  return { ds, plan, act };
}
function objPctB(o, pm, B) {
  const b = B[setKey(o)] || {}; const p = pm[o.id] || {}; let s = 0, w = 0;
  for (const [k] of setTahap(o)) { const bw = num(b[k]); w += bw; s += bw * (p[k] || 0) / 100; }
  return w ? s / w * 100 : 0;
}
function kurvaSVG(kd, o = {}) {
  const W = o.w || 820, H = o.h || 300, L = 42, R = 14, T = 16, Bm = 38;
  const n = kd.ds.length; if (!n) return '';
  const x = i => L + (W - L - R) * (n === 1 ? 0 : i / (n - 1)), y = v => T + (H - T - Bm) * (1 - v / 100);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;font:11px system-ui,Arial" role="img" aria-label="Kurva S">`;
  for (let v = 0; v <= 100; v += 20) s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#e3e8ee"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" fill="#6b7785">${v}%</text>`;
  kd.ds.forEach((d, i) => { if (i % 7 === 0 || i === n - 1) s += `<line x1="${x(i)}" x2="${x(i)}" y1="${T}" y2="${H - Bm}" stroke="#f0f2f5"/><text x="${x(i)}" y="${H - Bm + 14}" text-anchor="middle" fill="#6b7785">${pad(pd(d).getDate())}/${BLN[pd(d).getMonth()]}</text>`; });
  const ti = kd.ds.indexOf(today());
  if (ti >= 0) s += `<line x1="${x(ti)}" x2="${x(ti)}" y1="${T}" y2="${H - Bm}" stroke="#E07B24" stroke-dasharray="3 3"/><text x="${x(ti) + 3}" y="${T + 10}" fill="#E07B24">hari ini</text>`;
  s += `<polyline fill="none" stroke="#8a97a8" stroke-width="2.2" stroke-dasharray="6 4" points="${kd.plan.map((v, i) => x(i) + ',' + y(v)).join(' ')}"/>`;
  const pa = kd.act.map((v, i) => v === null ? null : x(i) + ',' + y(v)).filter(Boolean);
  if (pa.length) s += `<polyline fill="none" stroke="#1F3A5F" stroke-width="2.6" points="${pa.join(' ')}"/>`;
  const li = kd.act.reduce((a, v, i) => v === null ? a : i, -1);
  if (li >= 0) s += `<circle cx="${x(li)}" cy="${y(kd.act[li])}" r="4" fill="#1F3A5F"/><text x="${x(li) + 6}" y="${y(kd.act[li]) - 6}" fill="#1F3A5F" font-weight="700">${fmtN(kd.act[li], 1)}%</text>`;
  s += `<g transform="translate(${L + 6},${H - 10})"><line x1="0" x2="22" y1="-4" y2="-4" stroke="#8a97a8" stroke-width="2.2" stroke-dasharray="6 4"/><text x="27" y="0" fill="#333">Rencana</text><line x1="90" x2="112" y1="-4" y2="-4" stroke="#1F3A5F" stroke-width="2.6"/><text x="117" y="0" fill="#333">Realisasi</text></g>`;
  return s + '</svg>';
}

/* ================= PEMILIH OBJEK (banyak) ================= */
function objPicker(el, terpilih = []) {
  const set = new Set(terpilih);
  const objs = objAll();
  el.innerHTML = `<input class="inp" placeholder="Cari kode / no. (mis. F1-A7, P09, TB1-J)" style="margin-bottom:6px"><div class="objlist"></div><div class="small mut" style="margin-top:4px"><span class="cnt"></span> · <a href="#" data-a="none">kosongkan</a></div>`;
  const list = $('.objlist', el), q = $('input', el), cnt = $('.cnt', el);
  const draw = () => {
    const f = q.value.trim().toLowerCase(); let h = '';
    for (const pk of ['9', '8', '12']) for (const j of ['titik', 'tb']) {
      const g = objs.filter(o => o.paket === pk && o.jenis === j && (!f || (o.kode + ' ' + o.no).toLowerCase().includes(f)));
      if (!g.length) continue;
      h += `<div class="gp">Paket ${pk} — ${j === 'tb' ? 'tie beam' : 'titik'} <a href="#" data-all="${pk}|${j}" class="small">pilih semua</a></div>` + g.map(o => `<label class="${o.status !== 'AKTIF' ? 'dn' : ''}"><input type="checkbox" value="${esc(o.id)}" ${set.has(o.id) ? 'checked' : ''}>${esc(o.no)} <b>${esc(o.kode)}</b></label>`).join('');
    }
    list.innerHTML = h || '<span class="mut small">Tidak ada yang cocok.</span>';
    $$('input[type=checkbox]', list).forEach(c => c.onchange = () => { c.checked ? set.add(c.value) : set.delete(c.value); cnt.textContent = set.size + ' dipilih'; el.dispatchEvent(new Event('pilih')); });
    $$('[data-all]', list).forEach(a => a.onclick = e => { e.preventDefault(); const [pk, j] = a.dataset.all.split('|'); objs.filter(o => o.paket === pk && o.jenis === j && (!f || (o.kode + ' ' + o.no).toLowerCase().includes(f))).forEach(o => set.add(o.id)); draw(); el.dispatchEvent(new Event('pilih')); });
    cnt.textContent = set.size + ' dipilih';
  };
  q.oninput = draw; $('[data-a=none]', el).onclick = e => { e.preventDefault(); set.clear(); draw(); el.dispatchEvent(new Event('pilih')); };
  draw();
  return () => [...set];
}
function opsiTahapUntuk(ids) {
  const os = ids.map(objGet).filter(Boolean);
  if (!os.length) return TAHAP.std.concat(TAHAP.f1.filter(x => x[0] === 'cot')).concat(TAHAP.tb);
  const seen = new Map();
  for (const o of os) for (const [k, l] of setTahap(o)) if (!seen.has(k)) seen.set(k, l);
  return [...seen.entries()];
}

function teksWA(d) {
  const D = dataHarian(d), p = cfg('proyek'), tot = agregat(D.pm), ren = rencanaPct(d);

  L.push(`Cuaca: pagi ${D.H.pagi || '-'}, siang ${D.H.siang || '-'}, sore ${D.H.sore || '-'}${D.H.jamHujan ? ' (hujan ' + D.H.jamHujan + ')' : ''}`);
  L.push(`Manpower: ${D.mp.pek} pekerja + ${D.mp.staf} staf (rencana ${mpRencana(d)} pekerja)`);
  L.push('', '*Progress hari ini:*');
  if (D.pg.length) D.pg.forEach(r => { const o = objGet(r.obj) || {}; L.push(`• ${o.no || ''} ${o.kode || r.obj} — ${tahapNama(r.tahap)} ${fmtN(r.pct, 0)}%${r.org ? ' (' + r.org + ' org)' : ''}${r.ket ? ' — ' + r.ket : ''}`); }); else L.push('• -');
  L.push('', `*Kumulatif:* ${pct(tot)} (rencana ${pct(ren)}, deviasi ${fmtN(tot - ren, 1)}%)`);
  L.push(['9', '8', '12'].map(pk => `Paket ${pk}: ${pct(agregat(D.pm, o => o.paket === pk))}`).join(' | '));
  if (D.cor.length) { L.push('', '*Pengecoran:*'); D.cor.forEach(r => L.push(`• ${objLbl(r.obj)} ${r.elemen || ''} ${r.volD || r.volT || ''} m³`)); }
  if (D.H.kendala) L.push('', '*Kendala:* ' + D.H.kendala);
  if (D.kep.length) { L.push('', '*Keputusan lapangan:*'); D.kep.forEach(r => L.push(`• ${r.kendala}${r.keputusan ? ' → ' + r.keputusan : ''} (${r.status || ''})`)); }

}

let FT = { pk: '', q: '', dari: '', sampai: '' };

  let rs = rows('foto').sort((a, b) => a.tgl < b.tgl ? 1 : a.tgl > b.tgl ? -1 : 0);

  $$('[data-lx]').forEach(a => a.onclick = e => { e.preventDefault(); const l = cfg('logo'); l[a.dataset.lx] = ''; setCfg('logo', l); vAtur(); });
  $('#mpAdd').onclick = () => { const tr = document.createElement('tr'); tr.innerHTML = '<td><input type="date" class="inp sm"></td><td><input type="number" class="inp sm"></td><td><button class="btn sm del" data-mpx>×</button></td>'; $('#mpT tbody').appendChild(tr); tr.querySelector('[data-mpx]').onclick = () => tr.remove(); };
  $$('[data-mpx]').forEach(b => b.onclick = () => b.closest('tr').remove());
  $('#jSv').onclick = () => { const jj = {}; for (const k of ['9', '8', '12']) { const a = $(`[data-j1="${k}"]`).value, b = $(`[data-j2="${k}"]`).value; if (!a || !b || b < a) return toast('Jadwal paket ' + k + ' tidak valid', 'err'); jj[k] = [a, b]; } setCfg('jadwal', jj); setCfg('mp', $$('#mpT tbody tr').map(tr => { const i = $$('input', tr); return { mulai: i[0].value, jml: num(i[1].value) }; }).filter(x => x.mulai)); setCfg('cutoff', num($('#jCo').value)); setCfg('jamKerja', num($('#jJk').value) || 7); toast('Tersimpan'); };
  $('#bSv').onclick = () => { const nb = { std: {}, f1: {}, tb: {} }; $$('[data-b]').forEach(i => { const [s, k] = i.dataset.b.split('|'); nb[s][k] = num(i.value); }); for (const s of Object.keys(nb)) { const t = Object.values(nb[s]).reduce((a, b) => a + b, 0); if (Math.abs(t - 100) > .01) return toast('Jumlah bobot ' + s + ' = ' + t + ', harus 100', 'err'); } setCfg('bobot', nb); toast('Bobot tersimpan'); };
  $('#kbSv').onclick = () => { const l = $('#kbT').value.split('\n').map(x => x.trim()).filter(Boolean); if (!l.length) return; setCfg('kodeBiaya', [...new Set(l)]); toast('Kode biaya tersimpan'); };
  $('#uAdd').onclick = () => { put('users', { id: 'U' + (Math.max(0, ...Object.keys(TB_('users')).map(k => num(k.slice(1)))) + 1), nama: 'Pengguna baru', peran: 'SPV', pin: String(Math.floor(100000 + Math.random() * 900000)), aktif: '1' }); vAtur(); };
  $('#uSv').onclick = () => {
    const L = $$('[data-u]').map(tr => ({ id: tr.dataset.u, nama: $('[data-k=nama]', tr).value.trim(), peran: $('[data-k=peran]', tr).value, pin: $('[data-k=pin]', tr).value.trim(), aktif: $('[data-k=aktif]', tr).checked ? '1' : '0' }));
    const pins = L.filter(u => u.aktif === '1').map(u => u.pin);
    if (L.some(u => !/^\d{6}$/.test(u.pin))) return toast('PIN harus 6 angka', 'err');
    if (new Set(pins).size !== pins.length) return toast('PIN tidak boleh sama antar pengguna', 'err');
    if (!L.some(u => u.peran === 'PC' && u.aktif === '1')) return toast('Minimal satu Project Control aktif', 'err');
    L.forEach(u => { const o = get('users', u.id); if (!o || ['nama', 'peran', 'pin', 'aktif'].some(k => o[k] !== u[k])) put('users', Object.assign({}, o, u)); });
    toast('Pengguna tersimpan');
  };
  $('#bkDl').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify({ app: 'NACL_AEN_P8912', versi: APP_VER, waktu: Date.now(), db: S.db })], { type: 'application/json' })); a.download = 'cadangan_pondasi_nacl_' + today() + '.json'; a.click(); };
  $('#bkUp').onchange = e => { const fl = e.target.files[0]; if (!fl) return; const fr = new FileReader(); fr.onload = () => { try { const j = JSON.parse(fr.result); if (!j.db) throw 0; if (!yakin('Gabungkan cadangan ini ke data sekarang?')) return; let n = 0; for (const [t, o] of Object.entries(j.db)) for (const r of Object.values(o)) { if (!r || !r.id) continue; TB_(t)[r.id] = Object.assign({}, r, { _ubah: Date.now() }); S.dirty[t + '|' + r.id] = 1; n++; } persist(); jadwalKirim(); toast(n + ' baris dipulihkan'); render(); } catch (x) { toast('Berkas cadangan tidak valid', 'err'); } }; fr.readAsText(fl); };
}
async function periksaSinkron() {
  const L = []; const tulis = () => { const m = $('#cekBox'); if (m) m.innerHTML = L.map(([ok, t]) => `<div>${ok === null ? '⏳' : ok ? '✅' : '❌'} ${esc(t)}</div>`).join(''); };
  modal('Pemeriksaan sinkron', '<div id="cekBox" class="small" style="line-height:1.9"></div>');
  const run = async (t, f) => { L.push([null, t]); tulis(); try { const r = await f(); L[L.length - 1] = [true, t + (r ? ' — ' + r : '')]; } catch (e) { L[L.length - 1] = [false, t + ' — ' + e.message]; } tulis(); };
  L.push([true, 'Versi aplikasi ' + APP_VER]);
  if (!S.cfg.url) { L.push([false, 'URL server belum diisi']); return tulis(); }
  await run('Ping server', async () => { const r = await api('ping'); return 'versi ' + r.versi; });
  await run('Ambil semua data', async () => { const r = await api('muat', { sejak: 0 }); return Object.entries(r.data).map(([t, x]) => t + ' ' + x.length).join(', ') || 'kosong'; });
  await run('Catatan menunggu kirim', async () => String(jmlTunggu()));
  await run('Kirim catatan uji', async () => { const id = 'uji-' + (ME?.id || 'x'); await api('simpan', { baris: [{ t: 'uji', r: { id, _ubah: Date.now(), waktu: new Date().toISOString(), oleh: ME?.nama || '' } }] }); return 'ok'; });
}

/* ================= AUDIT ================= */
function vAudit() {
  const q = (FL.audit || '').toLowerCase();
  let rs = rows('audit').sort((a, b) => num(b.w) - num(a.w));
  if (q) rs = rs.filter(r => [r.u, r.aksi, r.t, r.rid, r.isi].join(' ').toLowerCase().includes(q));
  $('#main').innerHTML = `<h1>Jejak Audit</h1><p class="small mut" style="margin-top:-8px">Setiap tambah, ubah dan hapus tercatat: siapa, kapan, apa.</p><div class="row" style="margin-bottom:10px"><input class="inp" style="max-width:260px" id="auQ" placeholder="Cari nama / tabel / isi" value="${esc(FL.audit || '')}"><span style="flex:1"></span><span class="small mut">${rs.length} catatan</span><button class="btn" id="auXl">Excel</button></div>
  <div class="tw tall"><table class="t"><thead><tr><th>Waktu</th><th>Pengguna</th><th>Aksi</th><th>Tabel</th><th>Isi</th></tr></thead><tbody>${rs.slice(0, 500).map(r => `<tr><td style="white-space:nowrap">${fW(r.w)}</td><td>${esc(r.u)}</td><td><span class="b ${r.aksi === 'hapus' ? 'bad' : r.aksi === 'ubah' ? 'warn' : 'ok'}">${esc(r.aksi)}</span></td><td>${esc(r.t)}</td><td class="small">${esc(r.isi || r.rid)}</td></tr>`).join('')}</tbody></table></div>`;
  $('#auQ').onchange = e => { FL.audit = e.target.value; vAudit(); };
  $('#auXl').onclick = () => unduhExcel('Jejak_Audit_' + today(), [['Audit', [['Waktu', 'Pengguna', 'Aksi', 'Tabel', 'ID', 'Isi']].concat(rs.map(r => [fW(r.w), r.u, r.aksi, r.t, r.rid, r.isi]))]]);
}

/* ================= NAVIGASI, LOGIN, BOOT ================= */
const VIEWS = {
  dash: vDash, peta: vPeta, kurva: vKurva, harian: vHarian, mingguan: vMingguan, foto: vFoto, absen: vAbsen, upah: vUpah, kas: vKas, master: vMaster, atur: vAtur, audit: vAudit,
  keputusan: () => viewTabel('keputusan'), inspeksi: () => viewTabel('inspeksi'), cor: () => viewTabel('cor'), pekerja: () => viewTabel('pekerja', { atas: rs => `<div class="row" style="margin-bottom:8px"><span class="small">Aktif: <b>${rs.filter(r => r.status === 'Aktif' && !/Staf/.test(r.kategori || '')).length}</b> pekerja + <b>${rs.filter(r => r.status === 'Aktif' && /Staf/.test(r.kategori || '')).length}</b> staf · rencana hari ini ${mpRencana(today())} pekerja</span></div>` }),
  alat: () => viewTabel('alat'), material: () => viewTabel('material', { atas: rs => { const s = {}; rows('material').forEach(r => { const k = r.material + ' (' + (r.satuan || '') + ')'; s[k] = s[k] || [0, 0]; s[k][0] += num(r.masuk); s[k][1] += num(r.pakai); }); return Object.keys(s).length ? `<div class="card"><h2>Sisa material</h2><div class="tw"><table class="t"><thead><tr><th>Material</th><th class="n">Masuk</th><th class="n">Dipakai</th><th class="n">Sisa</th></tr></thead><tbody>${Object.entries(s).map(([k, [a, b]]) => `<tr><td>${esc(k)}</td><td class="n">${fmtN(a, 2)}</td><td class="n">${fmtN(b, 2)}</td><td class="n"><b>${fmtN(a - b, 2)}</b></td></tr>`).join('')}</tbody></table></div></div>` : ''; } }),
  inventaris: () => viewTabel('inventaris'), hse: () => viewTabel('hse'), surat: () => viewTabel('surat')
};
function menuLabel(k) { for (const [, it] of MENU) for (const [a, l] of it) if (a === k) return l; return k; }
function buka(k) { S.pref.menu = k; persist(); $('#nav').classList.remove('open'); render(); window.scrollTo(0, 0); }
function render() {
  if (!ME) return;
  let k = S.pref.menu || 'dash'; if (!bisaLihat(k) || !VIEWS[k]) k = 'dash';
  $('#nav').innerHTML = MENU.map(([g, it]) => { const v = it.filter(([a]) => bisaLihat(a)); return v.length ? `<div class="grp">${g}</div>` + v.map(([a, l]) => `<a class="${a === k ? 'on' : ''}" onclick="buka('${a}')">${l}</a>`).join('') : ''; }).join('') + `<div class="grp">v${APP_VER}</div>`;
  try { VIEWS[k](); } catch (e) { console.error(e); $('#main').innerHTML = `<div class="alert bad">Terjadi kesalahan saat menampilkan halaman: ${esc(e.message)}</div>`; }
  chip();
}
function layarLogin() {
  const el = $('#login'); el.classList.remove('hidden');
  let pin = '';
  el.innerHTML = `<div class="box"><div class="logos">${logoImg('mp', 50)}${logoImg('mpj', 50)}${logoImg('aen', 50)}</div><div style="font-weight:700;color:var(--navy);font-size:16px">Project Control Pondasi NaCl</div><div class="small mut" style="margin-bottom:12px">Paket 8, 9 & 12 · PT. Avindo Energi Nusantara</div>
  <input class="pinbox" id="pinIn" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="PIN"><div class="keys">${[1, 2, 3, 4, 5, 6, 7, 8, 9, '⌫', 0, '✓'].map(x => `<button data-k="${x}">${x}</button>`).join('')}</div><div id="pinMsg" class="small" style="color:var(--bad);min-height:18px"></div>
  <div class="small mut" style="margin-top:6px">v${APP_VER} · ${S.cfg.url ? 'tersambung ke server' : 'mode lokal'} · <a href="#" id="lgSrv">sambungan server</a></div></div>`;
  const inp = $('#pinIn', el);
  const coba = () => {
    const u = rows('users').find(x => x.pin === inp.value && x.aktif !== '0');
    if (!u) { $('#pinMsg', el).textContent = 'PIN salah'; inp.value = ''; return; }
    ME = u; S.pref.sesi = { uid: u.id, exp: Date.now() + 12 * 3600e3 }; persist(); el.classList.add('hidden'); mulaiApp();
  };
  inp.oninput = () => { inp.value = inp.value.replace(/\D/g, ''); $('#pinMsg', el).textContent = ''; if (inp.value.length === 6) coba(); };
  inp.onkeydown = e => { if (e.key === 'Enter') coba(); };
  $$('[data-k]', el).forEach(b => b.onclick = () => { const k = b.dataset.k; if (k === '⌫') inp.value = inp.value.slice(0, -1); else if (k === '✓') coba(); else if (inp.value.length < 6) { inp.value += k; if (inp.value.length === 6) coba(); } });
  $('#lgSrv', el).onclick = e => {
    e.preventDefault();
    const m = modal('Sambungan server', `<p class="small mut">Untuk perangkat baru. Lebih mudah: buka tautan setup yang dikirim Project Control.</p><div class="fld"><label>URL Web App (/exec)</label><input id="lgU" value="${esc(S.cfg.url)}"></div><div class="fld"><label>Kode akses</label><input id="lgT" value="${esc(S.cfg.token)}"></div><div class="row end"><button class="btn pri" id="lgOk">Sambungkan</button></div><div id="lgI" class="small"></div>`);
    $('#lgOk', m).onclick = async () => { S.cfg.url = $('#lgU', m).value.trim(); S.cfg.token = $('#lgT', m).value.trim(); S.srv = 0; persist(); $('#lgI', m).textContent = 'Menghubungkan…'; try { await api('ping'); await sinkron(true); $('#lgI', m).innerHTML = '<span class="b ok">Tersambung</span> Data diunduh. Silakan masuk dengan PIN.'; setTimeout(() => { tutupModal(); layarLogin(); }, 1200); } catch (x) { $('#lgI', m).innerHTML = '<span class="b bad">Gagal</span> ' + esc(x.message); } };
  };
  setTimeout(() => inp.focus(), 50);
}
function keluar() { ME = null; delete S.pref.sesi; persist(); $('#app').classList.add('hidden'); layarLogin(); }
function panelSinkron() {
  const m = modal('Sinkronisasi', `<div class="small" style="line-height:1.8">Server: ${S.cfg.url ? '<span class="b ok">terisi</span>' : '<span class="b warn">belum diatur — data hanya di perangkat ini</span>'}<br>Status: <b>${esc(SY.st)}</b>${SY.err ? ' — ' + esc(SY.err) : ''}<br>Terakhir berhasil: ${SY.last ? fW(SY.last) : '-'}<br>Menunggu kirim: ${Object.keys(S.dirty).length} catatan, ${Object.keys(S.pend).length} foto</div><div class="row end" style="margin-top:10px">${ME.peran === 'PC' ? '<button class="btn" id="psAt">Pengaturan server</button>' : ''}<button class="btn pri" id="psGo" ${S.cfg.url ? '' : 'disabled'}>Sinkronkan sekarang</button></div>`);
  const a = $('#psAt', m); if (a) a.onclick = () => { tutupModal(); buka('atur'); };
  $('#psGo', m).onclick = async () => { $('#psGo', m).disabled = true; S.srv = 0; await sinkron(true); tutupModal(); toast(SY.st === 'ok' ? 'Sinkron selesai' : 'Gagal: ' + SY.err, SY.st === 'ok' ? '' : 'err'); };
}
function mulaiApp() {
  $('#app').classList.remove('hidden');
  $('#userbtn').textContent = ME.nama + ' · ' + PERAN[ME.peran];
  render(); chip();
  if (S.cfg.url) sinkron();
}
function boot() {
  muatLokal();
  const m = /#setup=([^&]+)/.exec(location.hash);
  // Tautan setup sengaja tidak dihapus dari alamat: di iPhone, "Tambahkan ke Layar Utama" menyimpan alamat lengkap
  // dan ikon di layar utama punya penyimpanan sendiri, jadi ikon itu ikut tersambung otomatis.
  if (m) { try { const j = JSON.parse(decodeURIComponent(escape(atob(m[1])))); if (j.u && (j.u !== S.cfg.url || j.t !== S.cfg.token)) { S.cfg.url = j.u; S.cfg.token = j.t; S.srv = 0; persist(); setTimeout(() => toast('Perangkat tersambung ke server. Masuk dengan PIN Anda.'), 400); } } catch (e) { } }
  if (!S.cfg.url) semai();
  $('#burger').onclick = () => $('#nav').classList.toggle('open');
  $('#chip').onclick = panelSinkron;
  // PIN hanya bisa diubah Project Control lewat Pengaturan → Pengguna & PIN; menu pengguna hanya berisi Keluar.
  $('#userbtn').onclick = () => { const mm = modal(ME.nama, `<p class="small mut">${PERAN[ME.peran]}</p>${ME.peran === 'PC' ? '<p class="small">PIN semua pengguna diatur di <a href="#" id="ubAtur">Pengaturan → Pengguna & PIN</a>.</p>' : '<p class="small mut">Lupa atau ingin mengganti PIN? Hubungi Project Control.</p>'}<div class="row end"><button class="btn del" id="ubOut">Keluar</button></div>`); const a = $('#ubAtur', mm); if (a) a.onclick = e => { e.preventDefault(); tutupModal(); buka('atur'); }; $('#ubOut', mm).onclick = () => { tutupModal(); keluar(); }; };
  const ses = S.pref.sesi;
  const u = ses && ses.exp > Date.now() ? rows('users').find(x => x.id === ses.uid && x.aktif !== '0') : null;
  const lanjut = () => { const ss = S.pref.sesi; const uu = ss && ss.exp > Date.now() ? rows('users').find(x => x.id === ss.uid && x.aktif !== '0') : null; if (uu) { ME = uu; mulaiApp(); } else layarLogin(); };
  if (u) { ME = u; mulaiApp(); }
  else if (S.cfg.url && !rows('users').length) { $('#login').classList.remove('hidden'); $('#login').innerHTML = '<div class="box">Mengunduh data dari server…</div>'; sinkron(true).finally(lanjut); }
  else layarLogin();
  setInterval(() => { if (S.cfg.url && ME && !document.hidden) sinkron(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && S.cfg.url && ME) sinkron(); });
  window.addEventListener('online', () => { if (S.cfg.url && ME) sinkron(); });
}
document.addEventListener('DOMContentLoaded', boot);

</script></body></html>
